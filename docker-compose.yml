services:
  app:
    build: .
    working_dir: /app
    volumes:
      - ./:/app
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: commerciale_ai
      DB_USERNAME: commerciale_ai
      DB_PASSWORD: local-development-only
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: commerciale_ai
      POSTGRES_USER: commerciale_ai
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerciale_ai -d commerciale_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
